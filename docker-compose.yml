version: '3.9'

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: workshop
      MYSQL_USER: workshop_app
      MYSQL_PASSWORD: replace_with_secure_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: workshop
      MYSQL_USER: workshop_app
      MYSQL_PASSWORD: replace_with_secure_password
      HTTP_PORT: 8080
      ALLOWED_ORIGIN: http://localhost
      REQUEST_TIMEOUT_SECOND: 15
      DATABASE_TIMEOUT_SECOND: 5
      TOKEN_SECRET: replace_with_long_random_token_secret
      TOKEN_TTL_MINUTE: 480
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:8080"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
